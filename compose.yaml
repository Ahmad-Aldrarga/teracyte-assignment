services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_DB: experiments
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d experiments"]
      interval: 2s
      timeout: 2s
      retries: 30
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: teracyte-app:local
    command:
      - python
      - -m
      - uvicorn
      - services.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      MONGO_URL: mongodb://mongo:27017
      POSTGRES_URL: postgresql://starter:starter@postgres:5432/experiments
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    volumes:
      - ./data:/app/data

    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: teracyte-app:local

    command:
      - python
      - -m
      - celery
      - -A
      - services.api.tasks.celery_app
      - worker
      - --loglevel=INFO

    environment:
      POSTGRES_URL: postgresql://starter:starter@postgres:5432/experiments
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    volumes:
      - ./data:/app/data

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analysis:
    image: teracyte-app:local

    command:
      - python
      - -m
      - scripts.run_local
      - --experiment-id
      - demo-docker

    environment:
      MONGO_URL: mongodb://mongo:27017
      POSTGRES_URL: postgresql://starter:starter@postgres:5432/experiments

    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

    profiles:
      - jobs

    restart: "no"