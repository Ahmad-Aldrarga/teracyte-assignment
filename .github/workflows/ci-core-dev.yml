name: Dev CI

on:
  push:
    paths:
      - ".dockerignore"
      - ".github/workflows/ci-core-dev.yml"
      - "Dockerfile"
      - "compose.yaml"
      - "config/**"
      - "infra/**"
      - "pipelines/**"
      - "requirements-local.txt"
      - "scripts/generate_mock_data.py"
      - "scripts/model_handoff.py"
      - "scripts/run_local.py"
      - "services/**"
      - "tests/e2e_verify.py"
      - "tests/test_aggregation.py"
      - "tests/test_starter.py"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/ci-core-dev.yml"
      - "Dockerfile"
      - "compose.yaml"
      - "config/**"
      - "infra/**"
      - "pipelines/**"
      - "requirements-local.txt"
      - "scripts/generate_mock_data.py"
      - "scripts/model_handoff.py"
      - "scripts/run_local.py"
      - "services/**"
      - "tests/e2e_verify.py"
      - "tests/test_aggregation.py"
      - "tests/test_starter.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt

      - name: Run application tests
        run: |
          python -m pytest -q tests/test_starter.py tests/test_aggregation.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            teracyte-app:local
            teracyte-app:${{ github.sha }}

      - name: Run end-to-end verification
        run: python tests/e2e_verify.py

      - name: Clean up E2E containers
        if: always()
        run: docker compose down -v --remove-orphans

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/

      - name: Initialize Terraform
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infra validate
