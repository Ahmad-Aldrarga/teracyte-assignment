name: ML CI

on:
  push:
    paths:
      - "examples/model_lifecycle/**"
      - "scripts/publish_model.py"
      - "scripts/model_handoff.py"
      - "config/selected_model.json"
      - "tests/test_model_lifecycle.py"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    paths:
      - "examples/model_lifecycle/**"
      - "scripts/publish_model.py"
      - "scripts/model_handoff.py"
      - "config/selected_model.json"
      - "tests/test_model_lifecycle.py"
      - ".github/workflows/ml-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-validate-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-local.txt

      - name: Run ML unit tests
        run: |
          python -m pytest -q tests/test_model_lifecycle.py

      - name: Train and evaluate model
        run: |
          python -m examples.model_lifecycle.train \
            --output-dir data/model-lifecycle

      - name: Publish model v1
        run: |
          python -m scripts.publish_model \
            --model-path data/model-lifecycle/model.json \
            --version v1

      - name: Verify selected model and SHA-256
        run: |
          python -m scripts.model_handoff

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          version_dir = Path("data/models/v1")
          metadata = json.loads(
              (version_dir / "metadata.json").read_text()
          )

          actual_sha = hashlib.sha256(
              (version_dir / "model.json").read_bytes()
          ).hexdigest()

          assert metadata["sha256"] == actual_sha
          assert metadata["test_mse"] < 0.001

          print("Model artifact verification: PASS")
          PY

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-v1
          path: |
            data/models/v1/
            data/model-lifecycle/evaluation.json
          if-no-files-found: error
          retention-days: 7